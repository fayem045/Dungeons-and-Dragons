<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Dungeons and Dragons Game</title>
</head>
<body class="bg-dark">
    <button class="btn btn-success" onclick="window.history.back()">Back</button>

    <section id="gameContainer" class="container mt-5">
    <div class="text-center">
    <h1 class="text-light mb-4">---Choose Your Fate---</h1>
    <p class="text-light fs-5 mb-4">
        <span class="fw-bold text-info" id="playerNameDisplay">You</span>
        <span class="text-secondary"> vs </span>
        <span class="fw-bold text-danger" id="enemyNameDisplay">Dragon</span>
    </p>

    <img src="https://i.pinimg.com/originals/91/a5/89/91a5892bcda478077dfd157d7f4f7794.gif"
        class="rounded-circle img-fluid mx-auto d-block" alt="dice"
        style="max-width: 100%; max-height: 70vh; width: auto; height: auto;">

    <div class="mt-5 d-flex justify-content-center gap-5">
        <button class="btn btn-danger btn-lg action-btn" onclick="showBattleScene(); action(1)">Attack</button>
        <button class="btn btn-warning btn-lg action-btn" onclick="action(2)">Skill</button>
        <button class="btn btn-primary btn-lg action-btn" onclick="action(3)">Regen</button>
    </div>
    <!-- battle scene -->

    <div id="battleScene" class="row align-items-center justify-content-center mt-5 d-none">
        <div class="col-md-4 mb-3">
            <div class="card bg-secondary text-light shadow-sm">
                <div class="card-body text-center">
                    <h5 id="playerCardName" class="card-title">Player 1</h5>
                    <img id="playerImage" src="https://img.icons8.com/office/256/ffffff/knight-helmet.png" class="img-fluid mb-3" alt="Player 1" style="max-height: 220px; object-fit: contain;">
                    <p id="playerHp" class="mb-1">HP: 30/30</p>
                    <p id="playerMana" class="mb-0">Mana: 15/15</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 text-center mb-3">
            <div class="card bg-dark text-light shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">VS</h5>
                    <p class="lead mb-0">Player 1 vs Goblin</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card bg-danger text-light shadow-sm">
                <div class="card-body text-center">
                    <h5 id="enemyCardName" class="card-title">Goblin</h5>
                    <img id="enemyImage" src="https://img.icons8.com/color/256/000000/goblin.png" class="img-fluid mb-3" alt="Goblin" style="max-height: 220px; object-fit: contain;">
                    <p id="enemyHp" class="mb-1">HP: 15/15</p>
                    <p id="enemyMana" class="mb-0">Mana: 10/10</p>
                </div>
            </div>
        </div>
    </div>

    <div id="battleLog" class="mt-4 p-3 bg-black text-light rounded" style="min-height:140px;">
        <strong>Battle Log:</strong>
        <div id="battleMessages" class="mt-2">Click Attack to show the Goblin and start the fight.</div>
    </div>
<!-- battle scene end -->
    <div class="mt-5">
         <button class="btn btn-success btn-lg action-btn" onclick="window.location.reload()">Restart</button>
    </div>
</div>

    <div class="modal fade" id="endGameModal" tabindex="-1" aria-labelledby="endGameModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-center" id="endGameModalLabel">Battle Result</h5>
                </div>
                <div class="modal-body text-center" id="endGameMessage"></div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-success" onclick="window.location.reload()">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>
</body>
</html>
